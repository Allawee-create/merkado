<style>
:root{--bg:#E8ECEB;--surface:#fff;--ink:#0F1A21;--muted:#566771;--line:#cbd3d6;--accent:#1F8E85;--accent-ink:#fff;--tag:#F0B429;--tag-ink:#0F1A21;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A21;--surface:#18252E;--ink:#E8ECEB;--muted:#8DA0AB;--line:#243642;--accent:#3AB5AA;--accent-ink:#0F1A21;--tag:#F0B429;--tag-ink:#0F1A21;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1A21;--surface:#18252E;--ink:#E8ECEB;--muted:#8DA0AB;--line:#243642;--accent:#3AB5AA;--accent-ink:#0F1A21;--tag:#F0B429;--tag-ink:#0F1A21;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",Tahoma,Arial,sans-serif;line-height:1.6}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.row{display:flex;gap:10px;align-items:center}
h1{font-size:26px;margin:0;flex:1;font-weight:800;cursor:pointer;font-family:"Cairo",Tahoma,sans-serif;display:flex;align-items:center;gap:10px;line-height:1}
h1 svg{flex:none}
.menubtn{position:relative;padding:9px 11px;display:flex;align-items:center}
#mdot{position:absolute;top:5px;inset-inline-start:5px;width:10px;height:10px;border-radius:50%;background:var(--tag);border:2px solid var(--bg)}
#menu{position:absolute;left:16px;top:calc(100% - 4px);min-width:190px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.35);padding:6px;display:flex;flex-direction:column;gap:2px;z-index:20}
#menu[hidden]{display:none}
.mi{background:none;border:0;text-align:start;padding:12px 14px;border-radius:6px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.mi[hidden]{display:none}
a.mi{color:inherit;text-decoration:none}
.mn{font-weight:500;font-size:14px;color:var(--muted)}
.mi:hover,.mi:focus-visible{background:var(--bg)}
.mi b{background:var(--tag);color:var(--tag-ink);border-radius:10px;padding:0 7px;font-size:13px}
.hero{display:flex;align-items:center;justify-content:center;gap:clamp(14px,4vw,32px);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:clamp(20px,5vw,40px) 16px;margin-bottom:18px}
.hero svg{width:clamp(70px,20vw,130px);height:auto;flex:none}
.ht{display:flex;flex-direction:column;gap:4px;min-width:0}
.hn{font-family:"Cairo",Tahoma,sans-serif;font-weight:800;font-size:clamp(44px,13vw,84px);line-height:1.05;color:var(--ink)}
.hl{font-family:"Cairo",Tahoma,sans-serif;font-weight:600;font-size:clamp(13px,3.6vw,20px);letter-spacing:.46em;color:var(--accent);text-align:right}
.hs{position:relative;overflow:hidden;height:1.9em;direction:ltr;font-size:clamp(13px,3.8vw,18px);color:var(--muted);-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.tk{position:absolute;top:0;left:0;display:flex;white-space:nowrap;width:max-content;animation:tick 22s linear infinite}
.tk span{padding:0 1.4em;direction:rtl;unicode-bidi:isolate}
.tk span::before{content:"\25C6";color:var(--tag);margin-inline-end:1.4em;font-size:.7em;vertical-align:.1em}
@keyframes tick{from{transform:translateX(-50%)}to{transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){.tk{animation:none;transform:none}}
.cb h3,dialog h2{font-family:"Cairo",Tahoma,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:9px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.cartbtn b{background:var(--tag);color:var(--tag-ink);border-radius:10px;padding:0 7px;margin-inline-start:6px;font-size:13px}
input,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
main{max-width:1000px;margin:0 auto;padding:16px}
.lead{margin:4px 0 16px;color:var(--muted)}
.brands{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.brand{background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.mark{display:block;width:100%;border:0;text-align:start;padding:34px 22px;cursor:pointer;font-size:38px;font-weight:700;letter-spacing:1px;direction:ltr;text-align:left}
.bb{padding:14px 16px 16px}
.bb p{margin:0 0 10px;color:var(--muted);font-size:14px}
.cl{display:flex;flex-wrap:wrap;gap:8px}
.cl button{background:transparent;border:1px solid var(--line);border-radius:6px;padding:5px 12px}
.cl button:hover{border-color:var(--accent)}
.bar{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.bar .mark{width:auto;padding:8px 18px;font-size:24px;border-radius:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}
.chip{white-space:nowrap;background:transparent;border:1px solid var(--line);border-radius:6px;padding:5px 12px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden;display:flex;flex-direction:column}
.sw{height:12px}
.pic{background:#fff;height:150px;display:flex;align-items:center;justify-content:center;border-bottom:4px solid var(--line)}
.pic img{max-width:100%;max-height:100%;object-fit:contain}
#imgbox{display:flex;align-items:center;gap:10px;margin-top:6px}
#imgprev{width:84px;height:84px;object-fit:contain;background:#fff;border-radius:4px;border:1px solid var(--line)}
.cb{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.cb h3{margin:0;font-size:16px}
.cb small{color:var(--muted)}
.price{margin-top:auto;padding-top:8px;display:flex;flex-direction:column;align-items:stretch;font-weight:700;gap:8px}
.price span small{font-weight:400}
.acts{display:flex;gap:6px}
.acts .btn{flex:1;padding:9px 8px}
.btn.danger{background:#b3261e;color:#fff}
.badge{display:inline-block;border-radius:4px;padding:2px 10px;font-size:13px;font-weight:700;background:var(--line);color:var(--ink)}
.b-new{background:#fde9b0;color:#4a3500}.b-confirmed{background:#cfe8ff;color:#0b3556}.b-delivered{background:#cdeedd;color:#0b4a2a}.b-cancelled{background:#f6d0cd;color:#6b1410}
.trk{display:flex;gap:4px;margin:10px 0 4px}.trk i{flex:1;height:6px;border-radius:3px;background:var(--line)}.trk i.on{background:var(--accent)}
.trkl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px}
.step{flex:1;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--accent);border-radius:6px;overflow:hidden}
.step button{background:transparent;border:0;width:40px;height:38px;font-size:20px;color:var(--accent)}
.step b{min-width:28px;text-align:center}
#ocnt{background:var(--tag);color:var(--tag-ink);border-radius:10px;padding:0 7px;margin-inline-start:6px;font-size:13px}
#ordD{width:min(640px,94vw)}
.ord{border:1px solid var(--line);border-radius:4px;padding:12px;margin-bottom:10px}
.oh{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.oh span,.on{color:var(--muted);font-size:13px}
.oi{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line);font-size:14px}
.dsc{display:flex;gap:8px;align-items:center;padding:6px 0}
.dsc span{font-weight:700}
.dsc input{width:110px;padding:7px 10px}
.dsc select{width:auto;padding:7px 8px}
.dsc .btn{padding:7px 14px}
.disc{color:var(--accent)}
.ot{display:flex;justify-content:space-between;font-weight:700;padding:8px 0}
.empty{color:var(--muted);padding:40px 0;text-align:center}
dialog{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:min(440px,92vw);padding:18px;max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 12px;font-size:19px}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li>div:first-child{flex:1}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border:1px solid var(--line);background:transparent;border-radius:4px}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:18px;padding:14px 0}
label{display:block;font-size:14px;margin:10px 0 4px;color:var(--muted)}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:6px;display:none;z-index:20;text-align:center}

.foot{max-width:1000px;margin:24px auto 40px;padding:0 16px;text-align:center}
.foot .pw{margin:0 0 10px;font-size:13px;color:var(--muted);letter-spacing:.3px}
.foot .pw a{color:inherit;text-decoration:none;direction:ltr;unicode-bidi:isolate}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px}
.codebig{font-size:30px;font-weight:700;letter-spacing:4px;text-align:center;padding:8px 0;direction:ltr}
.trackf{display:flex;gap:8px;margin-bottom:12px}
.trackf input{flex:1;min-width:0}
</style>
</head>

<dialog id="cartD">

  <div class="total"><span>الإجمالي</span><span id="tot">0 د.ع</span></div>

  </form>

<dialog id="doneD">

  var h='<div class="bar"><button class="btn ghost" data-home>كل البراندات</button>'+mk(S.b,"div")+'</div>';
  h+='<input id="q" type="search" placeholder="ابحث داخل '+B.n+'…" aria-label="بحث" value="'+esc(S.q)+'"><div class="chips" style="margin-top:10px">';
  h+='<button class="chip" aria-pressed="'+(S.c==-1)+'" data-c="-1">الكل</button>';
  CATS.forEach(function(c,i){h+='<button class="chip" aria-pressed="'+(S.c==i)+'" data-c="'+i+'">'+c+'</button>'});
  h+='</div><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>ما أكو منتج مطابق. جرّب كلمة ثانية أو قسم ثاني.</div>';
  $("main").innerHTML=h;
  $("q").addEventListener("input",function(e){S.q=e.target.value.trim();grid()});
  grid();
}
function grid(){
  var B=BR[S.b];
  var list=all().filter(function(p){return p.b==S.b&&(S.c==-1||p.c==S.c)&&p.n.indexOf(S.q)>-1});
  $("empty").hidden=list.length>0;
  $("grid").innerHTML=list.map(function(p){
    var q=cart[p.id];
    return '<article class="card">'+(p.img?'<div class="pic" style="border-top:6px solid '+B.bg+'"><img src="'+esc(p.img)+'" alt="'+esc(p.n)+'" loading="lazy"></div>':'<div class="sw" style="background:'+B.bg+';border-bottom:4px solid '+B.bd+'"></div>')+'<div class="cb"><h3>'+esc(p.n)+'</h3><small>'+B.n+' — '+CATS[p.c]+'</small><div class="price"><span>'+fmt(p.p)+' <small>/ '+esc(p.u)+'</small></span><span class="acts">'+
    (q?'<span class="step"><button data-m="'+p.id+'" aria-label="نقص">−</button><b>'+q+'</b><button data-p="'+p.id+'" aria-label="زِد">+</button></span>':'<button class="btn" data-add="'+p.id+'">أضف</button>')+
    (isAdmin?'<button class="btn ghost" data-edit="'+p.id+'">تعديل</button>':'')+'</span></div></div></article>'
  }).join("");
}
function render(keep){S.b<0?home():brand();if(!keep)window.scrollTo(0,0)}

/* ---------- السلة ---------- */
function count(){var n=0;for(var k in cart)n+=cart[k];$("cnt").textContent=n}
function cartTotal(){var t=0;all().forEach(function(p){if(cart[p.id])t+=p.p*cart[p.id]});return t}
function lines(){
  var h="";
  all().forEach(function(p){var q=cart[p.id];if(!q)return;
    h+='<div class="li"><div><div>'+esc(p.n)+'</div><small>'+BR[p.b].n+' · '+fmt(p.p)+' / '+esc(p.u)+'</small></div><div class="qty"><button data-m="'+p.id+'" aria-label="نقص">−</button><span>'+q+'</span><button data-p="'+p.id+'" aria-label="زِد">+</button></div></div>'});
  $("lines").innerHTML=h||'<div class="empty">السلة فاضية. أضف منتجات من القائمة.</div>';
  $("tot").textContent=fmt(cartTotal());$("buy").disabled=!h;
}
function refresh(){count();lines();saveCart();if(S.b>=0&&$("grid"))grid()}
function itemsHtml(items){return (items||[]).map(function(i){return '<div class="oi"><span>'+esc(i.n)+' ('+(BR[i.b]?BR[i.b].n:"")+') × '+i.q+'</span><span>'+fmt(i.p*i.q)+'</span></div>'}).join("")}

/* ---------- المنتجات (قاعدة البيانات) ---------- */
function mapP(r){return {id:r.id,n:r.name,p:Number(r.price),u:r.unit,b:r.brand,c:r.cat,img:r.image||""}}
function loadProducts(){
  return sb.from("products").select("*").order("created_at",{ascending:false}).then(function(r){
    if(r.error){failed="تعذر تحميل المنتجات. حدّث الصفحة.";render(true);return}
    products=r.data.map(mapP);loaded=true;failed="";
    S.b<0?home():grid();lines();count();
  });
}
var imgState={url:"",file:null};
function showPrev(){var src=imgState.file?URL.createObjectURL(imgState.file):imgState.url;$("imgprev").hidden=!src;if(src)$("imgprev").src=src;$("imgx").hidden=!src}
$("imgf").addEventListener("change",function(e){imgState.file=e.target.files[0]||null;showPrev()});
$("imgx").onclick=function(){imgState.file=null;imgState.url="";$("imgf").value="";showPrev()};
function shrink(file){return new Promise(function(res,rej){
  var im=new Image(),u=URL.createObjectURL(file);
  im.onload=function(){var m=900,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    c.toBlob(function(b){b?res(b):rej()},"image/jpeg",.82)};
  im.onerror=rej;im.src=u})}
function uploadImg(file){
  return shrink(file).then(function(blob){
    var name=Date.now().toString(36)+Math.random().toString(36).slice(2,7)+".jpg";
    return sb.storage.from("product-images").upload(name,blob,{contentType:"image/jpeg",cacheControl:"31536000"}).then(function(r){
      if(r.error)throw r.error;
      return sb.storage.from("product-images").getPublicUrl(name).data.publicUrl;
    });
  });
}
function openForm(p){
  editing=p?p.id:null;delArm=false;
  $("ftitle").textContent=p?"تعديل المنتج":"أضف منتج للبيع";
  $("n").value=p?p.n:"";$("p").value=p?p.p:"";$("u").value=p?p.u:"";
  $("b").value=p?p.b:(S.b>=0?S.b:0);$("c").value=p?p.c:(S.c>=0?S.c:0);
  $("del").hidden=!p;$("del").textContent="حذف المنتج";
  imgState.url=p?p.img:"";imgState.file=null;$("imgf").value="";showPrev();
  $("addD").showModal();
}
function openEdit(id){var p=all().filter(function(x){return x.id==id})[0];if(p)openForm(p)}
function doDelete(){
  if(!delArm){delArm=true;$("del").textContent="اضغط مرة ثانية للتأكيد";return}
  sb.from("products").delete().eq("id",editing).then(function(r){
    if(r.error){toast("ما كدرنا نحذف. جرّب مرة ثانية.");return}
    $("addD").close();toast("تم حذف المنتج");loadProducts();
  });
}
$("f").addEventListener("submit",function(e){
  e.preventDefault();
  var d={name:$("n").value.trim(),price:+$("p").value,unit:$("u").value.trim(),brand:+$("b").value,cat:+$("c").value};
  var orig=editing?(all().filter(function(x){return x.id==editing})[0]||{}):{};
  var up=imgState.file?uploadImg(imgState.file):Promise.resolve(imgState.url);
  up.then(function(url){
    if(url||orig.img)d.image=url||null;
    var q=editing?sb.from("products").update(d).eq("id",editing):sb.from("products").insert(d);
    return q;
  }).then(function(r){
    if(r.error){toast(String(r.error.message||"").indexOf("image")>-1?"لازم تفعّل ميزة الصور بقاعدة البيانات أولاً":"ما كدرنا نحفظ. تأكد إنك داخل بحساب المالك.");return}
    var was=editing;$("addD").close();toast(was?"تم حفظ التعديل":"تمت إضافة المنتج");loadProducts();
  }).catch(function(e){var m=e&&e.message?e.message:"";toast(/bucket|not found/i.test(m)?"ما أكو مكان للصور بقاعدة البيانات. شغّل سكربت الصور بـ Supabase.":/row-level|policy|unauthor|jwt/i.test(m)?"ما عندك صلاحية. سجّل دخول المالك من جديد.":"ما كدرنا نرفع الصورة"+(m?" ("+m.slice(0,60)+")":"")+".",5000)});
});

/* ---------- طلب الزبون (بدون حساب) ---------- */
var CUST=lsGet("mm-cust",{}),MY=lsGet("mm-my",[]),mine=[],prevSt={};
$("buy").onclick=function(){
  if(!sb){toast("الموقع غير مربوط بقاعدة البيانات");return}
  $("cn").value=CUST.n||"";$("cp").value=CUST.p||"";$("cnote").value=CUST.a||"";
  $("ctot").textContent=fmt(cartTotal());
  $("cartD").close();$("chkD").showModal();
};
$("cf").addEventListener("submit",function(e){
  e.preventDefault();
  var nm=$("cn").value.trim(),ph=digits($("cp").value.trim()),ad=$("cnote").value.trim();
  var items=[];
  all().forEach(function(p){var q=cart[p.id];if(q)items.push({id:p.id,q:q})});
  if(!items.length||!sb)return;
  $("csend").disabled=true;
  sb.rpc("create_order",{p_name:nm,p_phone:ph,p_address:ad,p_items:items}).then(function(r){
    $("csend").disabled=false;
    if(r.error||!r.data){toast("ما كدرنا نرسل الطلب. جرّب مرة ثانية.");return}
    var o=r.data;
    CUST={n:nm,p:ph,a:ad};lsSet("mm-cust",CUST);
    MY.push({code:o.code,phone:ph});lsSet("mm-my",MY.slice(-30));
    cart={};refresh();$("chkD").close();showDone(o,ph);trackAll(true);
  });
});
function showDone(o,ph){
  $("doneB").innerHTML='<p><b class="badge b-new">'+MST.new+'</b></p><div class="codebig">'+esc(o.code)+'</div><p class="on" style="text-align:center">رقم طلبك. احتفظ فيه.</p>'+itemsHtml(o.items)+'<div class="ot"><span>الإجمالي</span><span>'+fmt(o.total)+'</span></div><p class="on">راح نتواصل وياك على '+esc(ph)+' حتى نأكد الطلب. تكدر تتابع حالته من زر «طلباتي».</p>';
  $("doneD").showModal();
}
function totHtml(o){var d=Number(o.discount||0);return d>0?'<div class="ot"><span>الإجمالي</span><span>'+fmt(o.total)+'</span></div><div class="ot disc"><span>الخصم</span><span>− '+fmt(d)+'</span></div><div class="ot"><span>المطلوب</span><span>'+fmt(Math.max(0,o.total-d))+'</span></div>':'<div class="ot"><span>الإجمالي</span><span>'+fmt(o.total)+'</span></div>'}
function trk(st){var n=st=="new"?1:st=="confirmed"?2:st=="delivered"?3:0;if(!n)return "";return '<div class="trk"><i class="on"></i><i class="'+(n>=2?"on":"")+'"></i><i class="'+(n>=3?"on":"")+'"></i></div><div class="trkl"><span>استلمنا الطلب</span><span>قيد التجهيز</span><span>تم التسليم</span></div>'}
function myRender(){
  var list=mine.slice().sort(function(x,y){return y.t-x.t});
  $("myL").innerHTML=list.length?list.map(function(o){
    var d=new Date(o.t).toLocaleString("en-GB",{dateStyle:"short",timeStyle:"short"});
    return '<div class="ord"><div class="oh"><b class="badge b-'+o.status+'">'+(MST[o.status]||o.status)+'</b><span>#'+esc(o.code)+' · '+d+'</span></div>'+trk(o.status)+itemsHtml(o.items)+totHtml(o)+'</div>'
  }).join(""):'<div class="empty">ما عندك طلبات بعد. إذا عندك رقم طلب اكتبه فوق مع رقم هاتفك.</div>';
}
function trackAll(first){
  if(!sb||!MY.length){mine=[];myRender();return Promise.resolve()}
  return Promise.all(MY.map(function(m){return sb.rpc("track_order",{p_code:m.code,p_phone:m.phone}).then(function(r){return r.data||null},function(){return null})})).then(function(res){
    var arr=res.filter(Boolean).map(function(o){return {code:o.code,status:o.status,items:o.items,total:Number(o.total),discount:Number(o.discount||0),t:Date.parse(o.created_at)}});
    arr.forEach(function(o){
      if(!first&&prevSt[o.code]&&prevSt[o.code]!=o.status&&MSG[o.status])toast(MSG[o.status],6000);
      prevSt[o.code]=o.status;
    });
    mine=arr;myRender();
  });
}
function menuShow(v){$("menu").hidden=!v;$("menuBtn").setAttribute("aria-expanded",v?"true":"false")}
$("menuBtn").onclick=function(e){e.stopPropagation();menuShow($("menu").hidden)};
document.addEventListener("click",function(e){if(!$("menu").hidden&&!$("menu").contains(e.target))menuShow(false)});
document.addEventListener("keydown",function(e){if(e.key==="Escape")menuShow(false)});
$("menu").addEventListener("click",function(){menuShow(false)});
$("myBtn").onclick=function(){trackAll(true);myRender();$("myD").showModal()};
$("tf").addEventListener("submit",function(e){
  e.preventDefault();
  if(!sb)return;
  var code=digits($("tc").value.trim()),ph=digits($("tp").value.trim());
  sb.rpc("track_order",{p_code:code,p_phone:ph}).then(function(r){
    if(r.error||!r.data){toast("ما لقينا طلب بهذا الرقم والهاتف. تأكد منهم.");return}
    if(!MY.some(function(m){return m.code==code}))MY.push({code:code,phone:ph});
    lsSet("mm-my",MY.slice(-30));$("tc").value="";trackAll(true);
  });
});
setInterval(function(){
  if(document.hidden||!MY.length)return;
  if(mine.some(function(o){return o.status=="new"||o.status=="confirmed"}))trackAll(false);
},20000);

/* ---------- المالك: الدخول والطلبات ---------- */
function mapO(r){return {id:r.id,code:r.code,name:r.name,phone:r.phone,note:r.address,items:r.items,total:Number(r.total),status:r.status,discount:Number(r.discount||0),t:Date.parse(r.created_at)}}
var seen={};lsGet("mm-seen",[]).forEach(function(k){seen[k]=1});
var notified={};
function markSeen(){orders.forEach(function(o){seen[o.id]=1});lsSet("mm-seen",Object.keys(seen).slice(-500));document.title=TITLE}
function beep(){try{var c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();setTimeout(function(){o.stop();c.close()},300)}catch(e){}}
function notifyNew(){
  var unseen=orders.filter(function(o){return o.status=="new"&&!seen[o.id]});
  if(!unseen.length){document.title=TITLE;return}
  document.title="("+unseen.length+") "+TITLE;
  var fresh=unseen.filter(function(o){return !notified[o.id]});
  if(!fresh.length)return;
  fresh.forEach(function(o){notified[o.id]=1});
  var msg=fresh.length>1?"وصلك "+fresh.length+" طلبات جديدة":"طلب جديد من "+fresh[0].name+" — "+fmt(fresh[0].total);
  toast(msg,7000);beep();
  try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}
  try{if(window.Notification&&Notification.permission=="granted")new Notification(TITLE,{body:msg})}catch(e){}
}
function ordersRender(){
  var cnt={new:0,confirmed:0,delivered:0,cancelled:0};
  orders.forEach(function(o){if(cnt[o.status]!==undefined)cnt[o.status]++});
  $("ocnt").textContent=cnt.new;$("ocnt").hidden=!cnt.new;$("mdot").hidden=!cnt.new;
  $("otabs").innerHTML=Object.keys(ST).map(function(k){return '<button class="chip" aria-pressed="'+(otab==k)+'" data-ot="'+k+'">'+ST[k]+' ('+cnt[k]+')</button>'}).join("");
  var list=orders.filter(function(o){return o.status==otab});
  function ab(st,label,cls){return '<button class="'+(cls||"btn ghost")+'" data-os="'+'ID|'+st+'">'+label+'</button>'}
  $("olist").innerHTML=list.length?list.map(function(o){
    var d=new Date(o.t).toLocaleString("en-GB",{dateStyle:"short",timeStyle:"short"});
    var act=o.status=="new"?ab("confirmed","أكّد وابدأ التجهيز","btn")+ab("cancelled","إلغاء"):
            o.status=="confirmed"?ab("delivered","تم التسليم","btn")+ab("cancelled","إلغاء"):
            o.status=="delivered"?ab("confirmed","رجّعه لقيد التجهيز"):ab("new","رجّعه لجديد");
    act=act.split("ID|").join(o.id+"|");
    return '<div class="ord"><div class="oh"><b>'+esc(o.name)+'</b><span>#'+esc(o.code)+' · '+d+'</span></div><div><a href="tel:'+esc(String(o.phone).replace(/[^0-9+]/g,""))+'">'+esc(o.phone)+'</a></div>'+itemsHtml(o.items)+(o.note?'<div class="on">'+esc(o.note)+'</div>':'')+totHtml(o)+((o.status=="new"||o.status=="confirmed")?'<div class="dsc"><span>خصم</span><input type="number" min="0" step="any" inputmode="decimal" id="dv-'+o.id+'" placeholder="0" aria-label="قيمة الخصم"'+(o.discount>0?' value="'+o.discount+'"':'')+'><select id="dt-'+o.id+'" aria-label="نوع الخصم"><option value="a">د.ع</option><option value="p">%</option></select><button class="btn ghost" data-od="'+o.id+'">طبّق</button></div>':'')+'<div class="row">'+act+'</div></div>'
  }).join(""):'<div class="empty">ما أكو طلبات '+ST[otab]+'.</div>';
}
function loadOrders(){
  return sb.from("orders").select("*").order("created_at",{ascending:false}).limit(500).then(function(r){
    if(r.error)return;
    orders=r.data.map(mapO);ordersRender();notifyNew();
  });
}
function setDiscount(id){
  var o=orders.filter(function(x){return x.id==id})[0];if(!o)return;
  var v=parseFloat(digits($("dv-"+id).value))||0,type=$("dt-"+id).value;
  var amt=type=="p"?Math.round(o.total*v/100):Math.round(v);
  if(amt<0)amt=0;if(amt>o.total)amt=o.total;
  sb.from("orders").update({discount:amt}).eq("id",id).then(function(r){
    if(r.error){toast(String(r.error.message||"").indexOf("discount")>-1?"لازم تفعّل ميزة الخصم بقاعدة البيانات أولاً":"ما كدرنا نطبّق الخصم. جرّب مرة ثانية.",5000);return}
    toast(amt>0?"تم تطبيق الخصم":"تم إلغاء الخصم");loadOrders();
  });
}
function setStatus(a){
  sb.from("orders").update({status:a[1]}).eq("id",a[0]).then(function(r){
    if(r.error){toast("ما كدرنا نغيّر حالة الطلب. جرّب مرة ثانية.");return}
    loadOrders();
  });
}
$("ordBtn").onclick=function(){
  try{if(window.Notification&&Notification.permission=="default")Notification.requestPermission()}catch(e){}
  markSeen();ordersRender();$("ordD").showModal();
};
function setAdmin(session){
  var was=isAdmin;isAdmin=!!session;
  $("addBtn").hidden=!isAdmin;$("ordBtn").hidden=!isAdmin;
  $("loginLink").textContent=isAdmin?"تسجيل خروج المالك":"دخول المالك";
  if(isAdmin&&!ordCh){
    loadOrders();
    ordCh=sb.channel("orders-feed").on("postgres_changes",{event:"*",schema:"public",table:"orders"},function(){loadOrders()}).subscribe();
  }
  if(!isAdmin&&ordCh){try{sb.removeChannel(ordCh)}catch(e){}ordCh=null;orders=[];document.title=TITLE}
  if(was!==isAdmin&&loaded){S.b<0?home():grid()}
}
$("loginLink").onclick=function(){
  if(!sb){toast("الموقع غير مربوط بقاعدة البيانات");return}
  if(isAdmin){sb.auth.signOut().then(function(){toast("تم تسجيل الخروج")});return}
  $("lf").reset();$("loginD").showModal();
};
$("lf").addEventListener("submit",function(e){
  e.preventDefault();
  sb.auth.signInWithPassword({email:$("le").value.trim(),password:$("lp").value}).then(function(r){
    if(r.error){toast("الإيميل أو الباسوورد غلط");return}
    $("loginD").close();toast("تم تسجيل الدخول");
  });
});

/* ---------- الأحداث العامة ---------- */
document.addEventListener("click",function(e){
  var t=e.target.closest("button,h1");if(!t)return;var d=t.dataset;
  if(t.id=="home"||d.home!==undefined){S={b:-1,c:-1,q:""};render()}
  else if(d.b!==undefined){S={b:+d.b,c:-1,q:""};render()}
  else if(d.bc){var a=d.bc.split(",");S={b:+a[0],c:+a[1],q:""};render()}
  else if(d.c!==undefined){S.c=+d.c;brand();window.scrollTo(0,0)}
  else if(d.ot){otab=d.ot;ordersRender()}
  else if(d.os){setStatus(d.os.split("|"))}
  else if(d.od){setDiscount(d.od)}
  else if(d.edit){openEdit(d.edit)}
  else if(d.del!==undefined){doDelete()}
  else if(d.add){cart[d.add]=(cart[d.add]||0)+1;refresh();toast("أُضيف للسلة")}
  else if(d.p){cart[d.p]++;refresh()}
  else if(d.m){if(--cart[d.m]<=0)delete cart[d.m];refresh()}
  else if(d.close!==undefined)t.closest("dialog").close();
});
$("cartBtn").onclick=function(){lines();$("cartD").showModal()};
$("addBtn").onclick=function(){openForm(null)};
$("b").innerHTML=ORD.map(function(i){return '<option value="'+i+'">'+BR[i].n+'</option>'}).join("");
$("c").innerHTML=CATS.map(function(c,i){return '<option value="'+i+'">'+c+'</option>'}).join("");

render();refresh();
if(!sb){
  failed=configured?"تعذر تحميل مكتبة قاعدة البيانات. تأكد من الإنترنت وحدّث الصفحة.":"الموقع غير مربوط بقاعدة البيانات بعد. افتح ملف README واتبع الخطوات.";
  render(true);
}else{
  loadProducts();
  sb.channel("products-feed").on("postgres_changes",{event:"*",schema:"public",table:"products"},function(){loadProducts()}).subscribe();
  sb.auth.getSession().then(function(r){setAdmin(r.data&&r.data.session)});
  sb.auth.onAuthStateChange(function(ev,sess){setAdmin(sess)});
  if(MY.length)trackAll(true);
}
</script>
</body>
</html>
